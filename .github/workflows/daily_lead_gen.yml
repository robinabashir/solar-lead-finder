name: Daily lead finder
on:
  schedule:
    - cron: '0 5 * * *'          # every day at 5:00 AM UTC
  workflow_dispatch:
    inputs:
      limit:
        description: 'Test run: stop after this many companies (leave empty for a full run)'
        required: false
        default: ''
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run the lead finder
        env:
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
          SECRET_TOKEN: ${{ secrets.SECRET_TOKEN }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          STATES: ${{ vars.STATES || 'CA,FL,TX,AZ' }}
          AREAS: ${{ vars.AREAS || '' }}
          VERIFY_MODE: ${{ vars.VERIFY_MODE || 'auto' }}
          SMTP_FROM: ${{ vars.SMTP_FROM || 'check@example.org' }}
          LIMIT_COMPANIES: ${{ github.event.inputs.limit }}
        run: python run.py
